spring.datasource.url=jdbc:h2:mem:codevision;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=codevision-test-signing-key-at-least-thirty-two-bytes
app.jwt.expiration-ms=3600000
app.cors.allowed-origin=http://localhost:5173
app.security.bcrypt-strength=4
