services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codevision}
      POSTGRES_USER: ${POSTGRES_USER:-codevision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codevision}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - codevision-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  codevision-data:
